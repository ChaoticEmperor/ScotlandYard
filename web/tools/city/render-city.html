<!doctype html>
<html><head><meta charset="utf-8"><title>Find Mr. X city renderer</title></head>
<body style="margin:0">
<script>
// Paints Find Mr. X's illustrated city board: the game's taxi links are the streets, every block is
// lined with small oblique-view houses, and the real Thames, parks and landmark positions come
// from OpenStreetMap. All drawing here is original and procedural (generic landmark icons).
// Driven by rasterize-city.cjs: window.renderCity(input) -> JPEG data URL.
// Map data (c) OpenStreetMap contributors, ODbL.
window.renderCity = function (I) {
  "use strict";
  var W = I.W, H = I.H, SC = I.scale, P = I.positions, osc = I.osm.scale;
  var seed = 20261019;
  function rnd() {
    seed = (seed + 0x6d2b79f5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  var pick = function (a) { return a[Math.floor(rnd() * a.length)]; };

  // ---------- masks at board resolution ----------
  function mask(draw) {
    var c = document.createElement("canvas"); c.width = W; c.height = H;
    var x = c.getContext("2d"); x.fillStyle = x.strokeStyle = "#000"; draw(x);
    var d = x.getImageData(0, 0, W, H).data, m = new Uint8Array(W * H);
    for (var i = 0; i < m.length; i++) m[i] = d[i * 4 + 3] > 40 ? 1 : 0;
    return m;
  }
  function osmPath(x, list, scale) {
    x.beginPath();
    list.forEach(function (f) {
      [f.p].concat(f.h || []).forEach(function (r) {
        x.moveTo(r[0] / scale, r[1] / scale);
        for (var i = 2; i < r.length; i += 2) x.lineTo(r[i] / scale, r[i + 1] / scale);
        x.closePath();
      });
    });
  }
  function roadsPath(x, extra, only) {
    x.beginPath();
    if (!only) I.taxi.forEach(function (e) { x.moveTo(P[e[0]][0], P[e[0]][1]); x.lineTo(P[e[1]][0], P[e[1]][1]); });
    (only || extra || []).forEach(function (pts) { x.moveTo(pts[0][0], pts[0][1]); for (var i = 1; i < pts.length; i++) x.lineTo(pts[i][0], pts[i][1]); });
  }
  var water = mask(function (x) { osmPath(x, I.osm.water, osc); x.fill("evenodd"); });
  var park = mask(function (x) { osmPath(x, I.osm.green.filter(function (g) { return g.big; }), osc); x.fill("evenodd"); });
  var road = mask(function (x) {
    x.lineCap = "round"; x.lineWidth = 15; roadsPath(x); x.stroke();
    x.lineWidth = 6; roadsPath(x, [], I.curves); x.stroke();
    I.stations.forEach(function (s) { x.beginPath(); x.arc(s[0], s[1], 17, 0, 7); x.fill(); });
  });
  // Beyond the game's streets the city continues along real side streets (thin, unmarked).
  var near = mask(function (x) {
    x.lineCap = "round"; x.lineWidth = 70; roadsPath(x); x.stroke();
    I.stations.forEach(function (s) { x.beginPath(); x.arc(s[0], s[1], 40, 0, 7); x.fill(); });
  });
  var minor = [];
  I.osm.roads.forEach(function (r) {
    if (r[0] < 2) return;
    for (var i = 1; i + 3 < r.length; i += 2) {
      var a = [r[i] / osc, r[i + 1] / osc], b = [r[i + 2] / osc, r[i + 3] / osc];
      var ax = a[0] | 0, ay = a[1] | 0, bx = b[0] | 0, by = b[1] | 0;
      if (ax < 0 || ay < 0 || bx < 0 || by < 0 || ax >= W || bx >= W || ay >= H || by >= H) continue;
      if (near[ay * W + ax] || near[by * W + bx] || water[ay * W + ax] || water[by * W + bx]) continue;
      if (Math.hypot(b[0] - a[0], b[1] - a[1]) < 1) continue;
      minor.push([a, b]);
    }
  });
  var minorMask = mask(function (x) {
    x.lineCap = "round"; x.lineWidth = 6.5; x.beginPath();
    minor.forEach(function (s) { x.moveTo(s[0][0], s[0][1]); x.lineTo(s[1][0], s[1][1]); });
    x.stroke();
  });
  var lines = mask(function (x) { x.lineCap = "round"; x.lineWidth = 9; roadsPath(x, [], I.lines || []); x.stroke(); });
  var occ = new Uint8Array(W * H);
  var at = function (m, x, y) { x |= 0; y |= 0; return x < 0 || y < 0 || x >= W || y >= H ? 1 : m[y * W + x]; };
  function freeRect(c, u, n, hw, hd, allowPark) {
    for (var a = -hw; a <= hw; a += 1.5)
      for (var b = -hd; b <= hd; b += 1.5) {
        var x = c[0] + u[0] * a + n[0] * b, y = c[1] + u[1] * a + n[1] * b;
        if (at(road, x, y) || at(minorMask, x, y) || at(water, x, y) || at(occ, x, y) || (!allowPark && at(park, x, y))) return false;
      }
    return true;
  }
  function markRect(c, u, n, hw, hd) {
    for (var a = -hw - 0.8; a <= hw + 0.8; a += 0.7)
      for (var b = -hd - 0.8; b <= hd + 0.8; b += 0.7) {
        var x = (c[0] + u[0] * a + n[0] * b) | 0, y = (c[1] + u[1] * a + n[1] * b) | 0;
        if (x >= 0 && y >= 0 && x < W && y < H) occ[y * W + x] = 1;
      }
  }
  function markDisc(x0, y0, r) {
    for (var y = Math.max(0, (y0 - r) | 0); y <= Math.min(H - 1, y0 + r); y++)
      for (var x = Math.max(0, (x0 - r) | 0); x <= Math.min(W - 1, x0 + r); x++)
        if ((x - x0) * (x - x0) + (y - y0) * (y - y0) <= r * r) occ[y * W + x] = 1;
  }

  // ---------- landmarks reserve their plots first ----------
  var SIZE = { dome: 17, museum: 17, castle: 16, bridge: 15, clock: 11, church: 14, palace: 18, wheel: 14, column: 9, chimney: 15,
    shard: 11, fountain: 10, market: 15, hall: 15, mast: 10, station: 18, globe: 11, stadium: 19, arch: 11, gherkin: 10 };
  var marks = [];
  I.landmarks.forEach(function (l) {
    var r = SIZE[l.icon] || 14, onWater = l.icon === "bridge";
    for (var k = 0; k < 400; k++) {
      var ang = k * 2.4, rad = Math.sqrt(k) * 2.6, x = l.x + Math.cos(ang) * rad, y = l.y + Math.sin(ang) * rad;
      var ok = true;
      for (var a = 0; a < 6.28 && ok; a += 0.5)
        for (var rr = 0; rr <= r && ok; rr += r / 3) {
          var px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
          if (at(road, px, py) || at(occ, px, py) || (!onWater && at(water, px, py))) ok = false;
        }
      if (ok) { marks.push({ l: l, x: x, y: y, r: r }); markDisc(x, y, r + 3); break; }
    }
  });

  // ---------- buildings along every street, then inner rows ----------
  var buildings = [], trees = [];
  var center = [W / 2, H * 0.45], maxD = Math.hypot(W, H) / 2;
  function addBuilding(c, u, n, w, d) {
    var dc = Math.hypot(c[0] - center[0], c[1] - center[1]) / maxD;
    var h = 3 + rnd() * 3.4 + (1 - dc) * 4 + (rnd() < 0.06 ? 4.5 : 0);
    var roofKind = rnd(), b = { c: c, u: u, n: n, w: w, d: d, h: h };
    b.roof = roofKind < 0.74 ? "hip" : roofKind < 0.88 ? "flat" : "slate";
    b.roofCol = b.roof === "hip" ? pick(["#d4693a", "#c75c30", "#df8045", "#bb532b", "#e2914f", "#cf6d3e"]) : b.roof === "slate" ? pick(["#7c8798", "#8a93a3", "#6f7a8c"]) : pick(["#cdbf9f", "#c3b391", "#d6cab0"]);
    b.wall = pick(["#f2e4c9", "#ead6b2", "#f5ecd9", "#ddc7a3", "#f0dcc0", "#c98a62"]);
    buildings.push(b);
    markRect(c, u, n, w / 2, d / 2);
  }
  I.taxi.forEach(function (e) {
    var A = P[e[0]], B = P[e[1]], dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy);
    var u = [dx / L, dy / L];
    [1, -1].forEach(function (s) {
      var n = [-u[1] * s, u[0] * s], t = 12;
      while (t < L - 12) {
        var w = 6 + rnd() * 6.5, d = 7 + rnd() * 5, off = 8.4 + d / 2;
        var c = [A[0] + u[0] * (t + w / 2) + n[0] * off, A[1] + u[1] * (t + w / 2) + n[1] * off];
        if (t + w < L - 10 && freeRect(c, u, n, w / 2 - 0.4, d / 2 - 0.4)) {
          addBuilding(c, u, n, w, d);
          if (rnd() < 0.75) {
            var d2 = 5.5 + rnd() * 5, off2 = off + d / 2 + 1.6 + d2 / 2, c2 = [A[0] + u[0] * (t + w / 2) + n[0] * off2, A[1] + u[1] * (t + w / 2) + n[1] * off2];
            if (freeRect(c2, u, n, w / 2, d2 / 2)) addBuilding(c2, u, n, w, d2);
          }
          t += w + 0.9;
        } else t += 1.5;
      }
    });
  });
  minor.forEach(function (sg) {
    var A = sg[0], B = sg[1], dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy), u = [dx / L, dy / L];
    [1, -1].forEach(function (s) {
      var n = [-u[1] * s, u[0] * s], t = 1;
      while (t < L - 1) {
        var w = 5.5 + rnd() * 5, d = 5.5 + rnd() * 4, off = 3.8 + d / 2;
        var c = [A[0] + u[0] * (t + w / 2) + n[0] * off, A[1] + u[1] * (t + w / 2) + n[1] * off];
        if (t + w <= L && !at(near, c[0], c[1]) && freeRect(c, u, n, w / 2 - 0.3, d / 2 - 0.3)) { addBuilding(c, u, n, w, d); t += w + 0.8; }
        else t += 1.5;
      }
    });
  });
  // Interior of blocks: more houses near streets, gardens and trees deeper in.
  function nearestRoadDir(x, y) {
    var best = 1e9, dir = [1, 0];
    I.taxi.forEach(function (e) {
      var A = P[e[0]], B = P[e[1]], vx = B[0] - A[0], vy = B[1] - A[1], l2 = vx * vx + vy * vy;
      var t = Math.max(0, Math.min(1, ((x - A[0]) * vx + (y - A[1]) * vy) / l2)), d = Math.hypot(A[0] + t * vx - x, A[1] + t * vy - y);
      if (d < best) { best = d; dir = [vx / Math.sqrt(l2), vy / Math.sqrt(l2)]; }
    });
    if (best > 30) minor.forEach(function (sg) {
      var A = sg[0], B = sg[1], vx = B[0] - A[0], vy = B[1] - A[1], l2 = vx * vx + vy * vy;
      if (Math.abs(A[0] - x) > 60 || Math.abs(A[1] - y) > 60) return;
      var t = Math.max(0, Math.min(1, ((x - A[0]) * vx + (y - A[1]) * vy) / l2)), d = Math.hypot(A[0] + t * vx - x, A[1] + t * vy - y);
      if (d < best) { best = d; dir = [vx / Math.sqrt(l2), vy / Math.sqrt(l2)]; }
    });
    return { d: best, u: dir };
  }
  // Phase A: pack the blocks with houses aligned to the nearest street.
  for (var k = 0; k < (W * H) / 12; k++) {
    var x = rnd() * W, y = rnd() * H;
    if (at(road, x, y) || at(water, x, y) || at(occ, x, y) || at(park, x, y)) continue;
    var nr = nearestRoadDir(x, y);
    if (nr.d > 30 || rnd() < 0.08) continue; // leave the odd garden
    var u2 = nr.u, n2 = [-u2[1], u2[0]], w3 = 5.5 + rnd() * 5.5, d3 = 5.5 + rnd() * 4.5;
    if (freeRect([x, y], u2, n2, w3 / 2, d3 / 2)) addBuilding([x, y], u2, n2, w3, d3);
  }
  // Phase B: trees in parks and whatever gardens remain.
  for (k = 0; k < (W * H) / 24; k++) {
    x = rnd() * W; y = rnd() * H;
    if (at(road, x, y) || at(water, x, y) || at(occ, x, y)) continue;
    if (rnd() < (at(park, x, y) ? 0.6 : 0.45)) { var r = 2.4 + rnd() * 2.6; trees.push({ x: x, y: y, r: r }); markDisc(x, y, r * 0.8); }
  }

  // ---------- paint ----------
  var cv = document.createElement("canvas"); cv.width = Math.round(W * SC); cv.height = Math.round(H * SC);
  var ctx = cv.getContext("2d");
  ctx.scale(SC, SC);
  ctx.fillStyle = "#a6c777"; ctx.fillRect(0, 0, W, H);
  // Garden texture.
  for (var g = 0; g < (W * H) / 40; g++) {
    ctx.fillStyle = rnd() < 0.5 ? "rgba(70,120,40,.10)" : "rgba(220,235,170,.10)";
    ctx.fillRect(rnd() * W, rnd() * H, 2 + rnd() * 3, 2 + rnd() * 3);
  }
  ctx.save(); ctx.scale(1 / osc, 1 / osc);
  osmPath(ctx, I.osm.green, 1); ctx.fillStyle = "#88c25d"; ctx.fill("evenodd");
  ctx.restore();
  ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.beginPath();
  minor.forEach(function (s) { ctx.moveTo(s[0][0], s[0][1]); ctx.lineTo(s[1][0], s[1][1]); });
  ctx.strokeStyle = "#d4c7a8"; ctx.lineWidth = 5.4; ctx.stroke();
  ctx.strokeStyle = "#f3ecdb"; ctx.lineWidth = 3.8; ctx.stroke();
  // Pavements along every street and squares around stations.
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.strokeStyle = "#d9cdb0"; ctx.lineWidth = 17.5; roadsPath(ctx); ctx.stroke();
  ctx.strokeStyle = "#ece3cc"; ctx.lineWidth = 16; roadsPath(ctx); ctx.stroke();
  I.stations.forEach(function (s) { ctx.beginPath(); ctx.arc(s[0], s[1], 17, 0, 7); ctx.fillStyle = "#ece3cc"; ctx.fill(); });
  // River with stone embankments.
  ctx.save(); ctx.scale(1 / osc, 1 / osc);
  osmPath(ctx, I.osm.water, 1);
  ctx.lineWidth = 7 * osc; ctx.strokeStyle = "#b9ab8a"; ctx.stroke();
  ctx.lineWidth = 4.5 * osc; ctx.strokeStyle = "#d8ccab"; ctx.stroke();
  ctx.fillStyle = "#4ea6dd"; ctx.fill("evenodd");
  ctx.restore();
  for (var wv = 0; wv < 700; wv++) {
    var wx = rnd() * W, wy = rnd() * H;
    if (!at(water, wx, wy)) continue;
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(wx - 4, wy); ctx.quadraticCurveTo(wx, wy - 1.5, wx + 4, wy); ctx.stroke();
  }

  // Shadows first, then everything sorted back-to-front.
  ctx.fillStyle = "rgba(45,35,20,.28)";
  buildings.forEach(function (b) {
    var sx = b.h * 0.55, sy = b.h * 0.22, q = corners(b);
    ctx.beginPath(); ctx.moveTo(q[0][0] + sx, q[0][1] + sy);
    for (var i = 1; i < 4; i++) ctx.lineTo(q[i][0] + sx, q[i][1] + sy);
    ctx.closePath(); ctx.fill();
  });
  trees.forEach(function (t) { ctx.beginPath(); ctx.ellipse(t.x + t.r * 0.7, t.y + t.r * 0.35, t.r * 1.05, t.r * 0.55, 0, 0, 7); ctx.fill(); });
  function corners(b) {
    var hw = b.w / 2, hd = b.d / 2, c = b.c, u = b.u, n = b.n;
    return [[-hw, -hd], [hw, -hd], [hw, hd], [-hw, hd]].map(function (p) { return [c[0] + u[0] * p[0] + n[0] * p[1], c[1] + u[1] * p[0] + n[1] * p[1]]; });
  }
  function shade(hex, f) {
    var v = parseInt(hex.slice(1), 16), r = (v >> 16) & 255, g2 = (v >> 8) & 255, b2 = v & 255;
    var m = function (x) { return Math.max(0, Math.min(255, Math.round(x * f))); };
    return "rgb(" + m(r) + "," + m(g2) + "," + m(b2) + ")";
  }
  function quad(a, b, c, d, fill) { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); }
  function drawBuilding(b) {
    var q = corners(b), h = b.h, up = function (p) { return [p[0], p[1] - h]; };
    // Ensure clockwise order so outward normals are consistent.
    var area = 0;
    for (var i = 0; i < 4; i++) area += q[i][0] * q[(i + 1) % 4][1] - q[(i + 1) % 4][0] * q[i][1];
    if (area < 0) q.reverse();
    for (i = 0; i < 4; i++) {
      var a = q[i], c = q[(i + 1) % 4], ex = c[0] - a[0], ey = c[1] - a[1], len = Math.hypot(ex, ey);
      var nx = ey / len, ny = -ex / len;
      if (ny <= 0.05) continue; // only walls facing the viewer
      var lit = 0.86 + 0.14 * (-nx);
      quad(a, c, up(c), up(a), shade(b.wall, lit * (0.92 + 0.08 * ny)));
      if (len > 5 && h > 3.4) {
        ctx.fillStyle = "rgba(55,65,85,.55)";
        for (var s = 1.6; s < len - 1.2; s += 2.4)
          for (var row = 0.3; row < 0.9; row += 0.36) {
            var wx = a[0] + (ex / len) * s, wy = a[1] + (ey / len) * s - h * row;
            ctx.fillRect(wx, wy - 0.6, 0.85, 1.1);
          }
      }
    }
    var r = q.map(up);
    if (b.roof === "flat") {
      quad(r[0], r[1], r[2], r[3], b.roofCol);
      ctx.strokeStyle = shade(b.roofCol, 0.8); ctx.lineWidth = 0.6; ctx.stroke();
      return;
    }
    // Hip roof: ridge along the long axis.
    var long01 = Math.hypot(r[1][0] - r[0][0], r[1][1] - r[0][1]) >= Math.hypot(r[2][0] - r[1][0], r[2][1] - r[1][1]);
    var A = long01 ? r : [r[1], r[2], r[3], r[0]];
    var mid0 = [(A[0][0] + A[3][0]) / 2, (A[0][1] + A[3][1]) / 2], mid1 = [(A[1][0] + A[2][0]) / 2, (A[1][1] + A[2][1]) / 2];
    var Ls = Math.hypot(mid1[0] - mid0[0], mid1[1] - mid0[1]), Ss = Math.hypot(A[3][0] - A[0][0], A[3][1] - A[0][1]);
    var inset = Math.min(0.45, (Ss / 2) / (Ls || 1));
    var R1 = [mid0[0] + (mid1[0] - mid0[0]) * inset, mid0[1] + (mid1[1] - mid0[1]) * inset - h * 0.12 - 1.2];
    var R2 = [mid1[0] + (mid0[0] - mid1[0]) * inset, mid1[1] + (mid0[1] - mid1[1]) * inset - h * 0.12 - 1.2];
    var col = b.roofCol;
    quad(A[3], A[0], R1, R1, shade(col, 1.12));
    quad(A[1], A[2], R2, R2, shade(col, 0.82));
    quad(A[0], A[1], R2, R1, shade(col, (A[0][1] + A[1][1]) / 2 < (A[2][1] + A[3][1]) / 2 ? 1.02 : 0.9));
    quad(A[2], A[3], R1, R2, shade(col, (A[0][1] + A[1][1]) / 2 < (A[2][1] + A[3][1]) / 2 ? 0.9 : 1.02));
    ctx.strokeStyle = shade(col, 0.68); ctx.lineWidth = 0.45;
    ctx.beginPath(); ctx.moveTo(R1[0], R1[1]); ctx.lineTo(R2[0], R2[1]); ctx.stroke();
    ctx.beginPath(); for (i = 0; i < 4; i++) ctx[i ? "lineTo" : "moveTo"](r[i][0], r[i][1]); ctx.closePath(); ctx.stroke();
  }
  function drawTree(t) {
    var greens = ["#3f8a3a", "#4f9a3e", "#5aa646", "#6fb24f", "#47913c"];
    var c = greens[Math.floor((t.x * 7 + t.y * 3) % greens.length)];
    ctx.fillStyle = "#6b4a2b"; ctx.fillRect(t.x - 0.5, t.y - 1.5, 1, 2);
    ctx.beginPath(); ctx.arc(t.x, t.y - t.r * 0.7, t.r, 0, 7); ctx.fillStyle = c; ctx.fill();
    ctx.beginPath(); ctx.arc(t.x - t.r * 0.35, t.y - t.r * 1.05, t.r * 0.5, 0, 7); ctx.fillStyle = "rgba(255,255,210,.22)"; ctx.fill();
  }

  // ---------- generic landmark icons (original shapes) ----------
  var STONE = "#ece6d8", STONE2 = "#cfc6b2", STONE3 = "#b3a990", SLATE = "#7e8a9c", GOLD = "#d9b24a", GLASS = "#9fc4dd";
  function box(x, y, w, d, h, wall, roof) { // axis-aligned oblique block centred at (x, y) footprint
    quad([x - w / 2, y + d / 2], [x + w / 2, y + d / 2], [x + w / 2, y + d / 2 - h], [x - w / 2, y + d / 2 - h], wall);
    quad([x - w / 2, y - d / 2 - h], [x + w / 2, y - d / 2 - h], [x + w / 2, y + d / 2 - h], [x - w / 2, y + d / 2 - h], roof);
    ctx.strokeStyle = "rgba(70,60,45,.45)"; ctx.lineWidth = 0.5;
    ctx.strokeRect(x - w / 2, y + d / 2 - h, w, h);
  }
  function windows(x, y, w, h, rows, gap) {
    ctx.fillStyle = "rgba(60,70,90,.55)";
    for (var r = 0; r < rows; r++) for (var i = x - w / 2 + 1.5; i < x + w / 2 - 1; i += gap) ctx.fillRect(i, y - h + 2 + r * (h - 3) / rows, 0.9, 1.4);
  }
  function columns(x, y, w, h, n) {
    ctx.fillStyle = STONE;
    for (var i = 0; i < n; i++) ctx.fillRect(x - w / 2 + 1 + (i * (w - 3)) / (n - 1), y - h, 1.1, h);
    ctx.fillStyle = "rgba(80,70,55,.3)";
    for (i = 0; i < n - 1; i++) ctx.fillRect(x - w / 2 + 2.1 + (i * (w - 3)) / (n - 1), y - h, (w - 3) / (n - 1) - 1.1, h);
