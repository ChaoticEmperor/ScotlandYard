# Deploys run from GitHub Actions (.github/workflows/deploy.yml), which builds dist/ with
# python3 web/tools/package.py --dir dist. This file only sets headers for the published site.

# The service worker must never be cached, or phones keep the old version of the game.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
