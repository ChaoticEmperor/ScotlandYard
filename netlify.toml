# Find Mr. X moved to Cloudflare Pages (https://scotlandyard-98u.pages.dev), which builds the game
# itself from this repository. Netlify now publishes only netlify-moved/, which sends players
# there: index.html for the home page, sw.js to clear the old offline cache on returning
# phones, and a 301 redirect for every other path. Cloudflare Pages ignores this file.
[build]
  command = ""
  publish = "netlify-moved"

[[redirects]]
  from = "/*"
  to = "https://scotlandyard-98u.pages.dev/:splat"
  status = 301

# The replacement service worker must be fetched fresh so returning phones pick it up.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
