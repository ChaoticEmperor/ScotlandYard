# Deploys the game to Netlify on every push to master (or by hand from the Actions tab).
# Needs two repository secrets: NETLIFY_AUTH_TOKEN (Netlify → User settings → Applications →
# Personal access tokens) and NETLIFY_SITE_ID (the site's Project configuration → Project ID).
name: Deploy to Netlify

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rule and protocol tests
        run: |
          node web/tests/test.mjs
          node web/tests/protocol.mjs

      - name: Build the site (stamps the offline cache)
        run: python3 web/tools/package.py --dir dist

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Add the NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID repository secrets."
            exit 1
          fi
          npx --yes netlify-cli@17 deploy --dir=dist --prod --message "${GITHUB_SHA::7}: ${{ github.event.head_commit.message || 'manual deploy' }}" | tail -n 20
